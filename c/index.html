<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 상담</title>
<style>html,body{margin:0;height:100%;font-family:'Malgun Gothic',sans-serif}iframe{border:0;width:100%;height:100%;display:block}p{padding:20px;text-align:center;color:#555}</style></head>
<body><p id="m">상담 화면을 여는 중입니다…</p><script>
var s=new URLSearchParams(location.search).get('s')||'';
fetch('../route.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
var f=document.createElement('iframe');f.src=j.api+'/c/'+encodeURIComponent(s);f.allow='clipboard-write';
document.getElementById('m').remove();document.body.appendChild(f)}).catch(function(){document.getElementById('m').textContent='잠시 뒤 다시 열어 주세요.'});
</script></body></html>
